# Production stack -- the same five processes docker-compose.dev.yml's
# Postgres/PgBouncer/Redis started, plus api/celery-worker/celery-beat
# built from services/api/Dockerfile. Designed for Launch Runbook Tier A
# (a dedicated VM) or Tier C (an Oracle Cloud "Always Free" VM) -- same
# file either way, only the host it runs on differs.
#
# Two api replicas (api_1/api_2) instead of a `deploy.replicas` block on
# purpose: `deploy.replicas` is only honored by `docker stack deploy`
# (Swarm mode), not plain `docker compose up` -- naming them explicitly
# lets a rolling-restart script (runbook Phase 6) target one container at
# a time and poll ITS OWN /readyz before touching the other.
#
# Bring-up (from the repo root, on the VM):
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d
#
# `--env-file .env` is NOT optional -- Compose's default .env discovery is
# relative to the COMPOSE FILE's directory (deploy/), not the caller's cwd
# or the repo root, and silently falls back to every variable's default
# (${POSTGRES_PORT:-5432}, etc.) if the real file isn't found that way.
# This bit us once already this build: an early `docker compose up` from
# the repo root picked up none of .env's real values and bound Postgres to
# host port 5432 anyway, colliding with a native Postgres install on the
# same machine. Explicit --env-file avoids ever hitting that again.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    # Bound to loopback only -- reachable from the VM itself (migrations,
    # psql, backups) but never from the public internet. Nothing but
    # Nginx needs a port published beyond the internal compose network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: chatbot-pgbouncer
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-chatbot}
      POOL_MODE: transaction
      LISTEN_PORT: 6432
      ADMIN_USERS: ${POSTGRES_USER}
      AUTH_TYPE: scram-sha-256
      # Sized for a small VM (Tier A/C's 2-4 vCPU). Revisit alongside
      # runbook Phase 8's load test, not by guessing upward.
      DEFAULT_POOL_SIZE: 20
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    # Dev's Redis has no password at all -- fine on a machine only you can
    # reach. Production shares a VM with the public internet even with the
    # port loopback-bound below (defense in depth, not the only control).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SR-24: self-hosted companion embedding container (sentence-transformers/
  # all-MiniLM-L6-v2) -- see deploy/embeddings-service/app.py's docstring
  # for why this exists. Internal-network-only by construction: no `ports:`
  # published, same trust model as postgres/redis/pgbouncer above. A
  # tenant opts in by setting embedding_base_url=http://embeddings:8080/v1
  # in its LLM config (POST /debug/llm/config) -- every tenant that leaves
  # it unset is entirely unaffected, so this service is decoupled from
  # api_1's own startup (no depends_on either direction).
  embeddings:
    build:
      context: ./embeddings-service
      dockerfile: Dockerfile
    image: chatbot-embeddings:latest
    container_name: chatbot-embeddings
    restart: unless-stopped

  # admin-web: the Next.js admin console (apps/admin-web). Server-side only
  # -- ADMIN_API_BASE_URL/JWT_SECRET are read at runtime by lib/env.ts and
  # never bundled into client JS (server-only). JWT_SECRET comes from the
  # SAME ../.env value api_1 uses below -- it verifies JWTs api_1 minted, it
  # never mints its own, so the two secrets are the same secret by
  # necessity, not coincidence. ADMIN_API_BASE_URL points at api_1 over the
  # internal Docker network (no TLS hop, no public round-trip for
  # server-to-server calls) rather than the public nip.io hostname.
  admin-web:
    build:
      context: ../apps/admin-web
      dockerfile: Dockerfile
    image: chatbot-admin-web:latest
    container_name: chatbot-admin-web
    env_file:
      - ../.env
    environment:
      ADMIN_API_BASE_URL: http://api_1:8000
    depends_on:
      - api_1
    restart: unless-stopped

  api_1: &api_service
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: chatbot-api:latest
    container_name: chatbot-api-1
    env_file:
      - ../.env
    environment:
      # Overrides ../.env's dev-shaped DATABASE_URL/REDIS_URL with the
      # in-network hostnames Docker Compose's own DNS resolves -- ../.env
      # keeps every OTHER app setting (secrets, thresholds, provider
      # config) as the single source of truth.
      #
      # NOT `?statement_cache_size=0` on the DSN -- that's an asyncpg
      # CLIENT-side pool option, not a Postgres wire-protocol startup
      # parameter, and asyncpg forwards unrecognized DSN query params
      # straight to the server, which then rejects it outright
      # ("unsupported startup parameter") and refuses to boot. app.py
      # already passes `statement_cache_size=0` as a real connect() kwarg
      # (common/db.py threads it through correctly) -- this DSN only needs
      # to be a plain connection string.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-chatbot}
      # Migrations (`docker compose run --rm api alembic upgrade head`,
      # runbook Phase 4) connect DIRECTLY to Postgres, bypassing PgBouncer's
      # transaction-pool mode -- it can't run DDL. ../.env's own
      # DATABASE_URL_DIRECT is the dev-host value (localhost:5434); inside
      # this network "localhost" is the container itself, not the postgres
      # service, so it must be overridden the same way DATABASE_URL is.
      DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chatbot}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # STORAGE_BACKEND=local (../.env) writes uploaded documents to
    # STORAGE_LOCAL_ROOT (/app/storage) on whichever container's own
    # filesystem handled the upload request. Without a shared volume here,
    # api_1 (upload) and celery-worker (ingestion) each see a DIFFERENT,
    # container-local /app/storage -- the worker's ingest_document task
    # fails with FileNotFoundError trying to read a file that only exists
    # inside api_1. Named volume + the SAME mount path on every service
    # sharing this anchor (api_1/api_2/celery-worker/celery-beat) makes
    # /app/storage one real shared filesystem across all of them.
    volumes:
      - chatbot_storage:/app/storage
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api_2:
    <<: *api_service
    container_name: chatbot-api-2

  celery-worker:
    <<: *api_service
    container_name: chatbot-celery-worker
    # Linux, not the Windows dev box -- prefork (the default pool) is fine
    # here; the .env.example's "--pool=solo required on Windows" note does
    # not apply in production.
    command: ["celery", "-A", "api.tasks.celery_app", "worker", "--loglevel=info"]
    # The image's baked-in HEALTHCHECK curls localhost:8000/healthz --
    # nothing listens there in this container (it runs the celery command,
    # not uvicorn), so the inherited check would always fail without this.
    healthcheck:
      disable: true

  celery-beat:
    <<: *api_service
    container_name: chatbot-celery-beat
    # Beat is a singleton by design -- running two would double-fire every
    # scheduled job (reminders, retention pruning). Never add a beat_2.
    command: ["celery", "-A", "api.tasks.celery_app", "beat", "--loglevel=info"]
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27-alpine
    container_name: chatbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api_1
      - api_2
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  chatbot_storage:
    driver: local
