services:
  api_1:
    expose:
      - '8000'

  nginx_demo:
    image: nginx:1.27-alpine
    container_name: chatbot-nginx-demo
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api_1
    restart: unless-stopped
