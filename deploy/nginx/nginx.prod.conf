# Production edge config (CLAUDE.md api-gateway-bff: "SSL termination,
# path routing, security headers, correlation IDs, rate limiting"). Sits
# behind Cloudflare (SSL mode: Full Strict) -- Cloudflare terminates the
# visitor's TLS; this terminates Cloudflare's own re-encrypted connection
# to the origin.
#
# TLS certs referenced below are a Cloudflare Origin Certificate (Cloudflare
# dashboard -> SSL/TLS -> Origin Server -> Create Certificate), NOT a public
# CA cert -- it's only trusted by Cloudflare's edge, which is exactly and
# only who is meant to connect here directly. Mount the two files the
# dashboard gives you at:
#   deploy/nginx/certs/origin.pem
#   deploy/nginx/certs/origin-key.pem

upstream chatbot_api {
    server api_1:8000 max_fails=3 fail_timeout=10s;
    server api_2:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Real-client-IP resolution: api/src/api/ratelimit.py trusts ONLY the
# first hop of X-Forwarded-For, "behind the Nginx proxy" -- meaning Nginx
# is expected to be the sole source of truth for that header, never a
# passthrough of whatever a client or edge sent. The realip module below
# rewrites $remote_addr to the true visitor IP from Cloudflare's
# CF-Connecting-IP (itself unspoofable -- Cloudflare sets it at their edge,
# discarding any client-supplied value) BEFORE the X-Forwarded-For sent
# downstream is built from $remote_addr, not appended to. Without this,
# either every visitor appears to rate-limit as "Cloudflare's IP" or a
# visitor can spoof their own X-Forwarded-For to bypass rate limiting
# entirely -- this is a real control, not boilerplate.
#
# Cloudflare's IPv4 ranges (refresh from https://www.cloudflare.com/ips-v4
# periodically -- these change occasionally, rarely, but do change):
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

gzip on;
gzip_types application/json application/javascript text/css text/plain;
gzip_min_length 512;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Matches INGESTION_MAX_UPLOAD_BYTES's default (10 MiB) with headroom
    # for multipart overhead -- keep these two in step if that setting
    # changes.
    client_max_body_size 12m;

    # Security headers (api-gateway-bff scope). CSP is deliberately narrow
    # for a page that only serves a JSON API -- the admin console and
    # landing page are separate origins with their own headers, not this.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location /healthz {
        proxy_pass http://chatbot_api;
        access_log off;
    }

    location / {
        proxy_pass http://chatbot_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # Overwritten, not appended -- see the realip comment above for why.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nginx's own per-request unique ID -- read by app.py's
        # correlation_id_middleware as X-Correlation-Id if the client
        # didn't already send one, so it's stamped this early rather than
        # only once the request reaches FastAPI.
        proxy_set_header X-Correlation-Id $request_id;

        proxy_connect_timeout 5s;
        # Above llm_timeout_seconds's default (30s) plus margin -- an LLM
        # call that's genuinely still working must not get cut off by the
        # edge before the app's own timeout has a chance to fire first.
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
