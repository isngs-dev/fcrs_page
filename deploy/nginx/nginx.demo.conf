# Demo edge config (SR-22 nip.io path) -- no CDN in front, so $remote_addr
# IS the real visitor IP directly (unlike nginx.prod.conf, which trusts
# Cloudflare's CF-Connecting-IP header instead). TLS cert is a real,
# browser-trusted Let's Encrypt certificate for the nip.io hostname that
# maps to this Droplet's own IP -- issued via `certbot certonly --standalone`,
# no owned domain required.

upstream chatbot_api {
    server api_1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name 159-89-230-107.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 159-89-230-107.nip.io;

    ssl_certificate     /etc/letsencrypt/live/159-89-230-107.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/159-89-230-107.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location /healthz {
        proxy_pass http://chatbot_api;
        access_log off;
    }

    location / {
        proxy_pass http://chatbot_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
