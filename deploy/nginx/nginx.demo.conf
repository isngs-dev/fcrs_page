# Demo edge config (SR-22 nip.io path) -- no CDN in front, so $remote_addr
# IS the real visitor IP directly (unlike nginx.prod.conf, which trusts
# Cloudflare's CF-Connecting-IP header instead). TLS cert is a real,
# browser-trusted Let's Encrypt certificate for the nip.io hostname that
# maps to this Droplet's own IP -- issued via `certbot certonly --standalone`,
# no owned domain required.

server {
    listen 80;
    server_name 159-89-230-107.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 159-89-230-107.nip.io;

    ssl_certificate     /etc/letsencrypt/live/159-89-230-107.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/159-89-230-107.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # The API is reached through a VARIABLE + `resolver` (Docker's embedded
    # DNS), not a static `upstream {}` block, for the same reason as the
    # admin-web vhost below: a static upstream name is resolved ONCE at nginx
    # startup, so every `docker compose up --build` of the API (new container
    # = new IP) left nginx proxying to the dead old IP -> 502 on every API
    # route until someone remembered `nginx -s reload`. Per-request
    # resolution (cached 10s) follows the new container automatically.
    resolver 127.0.0.11 valid=10s;

    location /healthz {
        set $api_backend api_1:8000;
        proxy_pass http://$api_backend;
        access_log off;
    }

    location / {
        set $api_backend api_1:8000;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}

# admin-web console -- a separate origin on its own port (SAME cert/hostname,
# just a different listen port -- Let's Encrypt certs are per-hostname, not
# per-port, so no second certbot run is needed). Deliberately NOT the same
# server block/path as the API: admin-web is a full HTML app with its own
# cookie-based session, not JSON responses, so it gets its own vhost rather
# than a path prefix (which would need Next's basePath wired through every
# route/asset/middleware matcher for no real benefit here).
#
# proxy_pass targets a VARIABLE, not a static `upstream {}` block -- an
# `upstream {}` server name is resolved ONCE, at nginx startup, and nginx
# refuses to start at all ("host not found in upstream") if that name isn't
# resolvable yet. That took the ENTIRE site down once already: admin-web
# hadn't finished its first build, so nginx itself failed to boot, and
# every other route (API, widget) went down with it even though those
# containers were fine. A variable + explicit `resolver` forces per-REQUEST
# DNS resolution via Docker's embedded DNS (127.0.0.11) instead -- nginx
# starts regardless of admin-web's state, and only a request to this vhost
# 502s until admin-web is actually reachable.
server {
    listen 8443 ssl;
    http2 on;
    server_name 159-89-230-107.nip.io;

    ssl_certificate     /etc/letsencrypt/live/159-89-230-107.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/159-89-230-107.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $admin_web_backend admin-web:3000;
        proxy_pass http://$admin_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # $http_host (verbatim original Host header, INCLUDES the :8443
        # port), not $host (nginx strips the port from that variable by
        # definition). Next.js Server Actions compare the browser's real
        # Origin header (which always includes a non-default port) against
        # the forwarded host it derives from this header, and reject the
        # request outright on a mismatch ("Invalid Server Actions request")
        # -- every login attempt failed with a 500 until this matched.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
